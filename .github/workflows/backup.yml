name: DB backup
on:
  schedule:
    - cron: "0 21 * * *"   # каждый день, ночью по Казахстану
  workflow_dispatch:        # плюс кнопка ручного запуска
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install pg client 17
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget -qO- https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/trusted.gpg.d/pgdg.asc >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
      - name: Dump and encrypt
        env:
          DATABASE_PUBLIC_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          F="bil-$(date -u +%Y%m%d-%H%M).dump"
          pg_dump "$DATABASE_PUBLIC_URL" -Fc --no-owner --no-privileges -f "$F"
          test -s "$F"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
              --symmetric --cipher-algo AES256 -o "$F.gpg" "$F"
          ls -lh "$F.gpg"
          echo "FILE=$F.gpg" >> "$GITHUB_ENV"
      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 cp "$FILE" "s3://${{ secrets.R2_BUCKET }}/$FILE" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
