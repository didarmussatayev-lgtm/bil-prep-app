name: Seed content

# Загружает учебный контент (prisma/seed) в базу на Railway.
# Автоматически — после слияния в main, если менялись файлы контента; только для тех предметов, чьи файлы изменились.
# Вручную — кнопка Run workflow: можно указать предметы (math, logic, grade5, nis-science, nis-english) или оставить пусто = все.
on:
  push:
    branches: [main]
    paths:
      - "prisma/seed/**"
  workflow_dispatch:
    inputs:
      subjects:
        description: "Предметы через запятую: math, logic, grade5, nis-science, nis-english (пусто = все)"
        required: false
        default: ""

concurrency: seed

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Какие предметы загружать
        id: pick
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "subjects=${{ github.event.inputs.subjects }}" >> "$GITHUB_OUTPUT"
            echo "run=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES=$(git diff --name-only HEAD~1 HEAD -- prisma/seed || true)
          S=""
          add() { case ",$S," in *",$1,"*) ;; *) S="${S:+$S,}$1";; esac; }
          while read -r f; do
            case "$f" in
              prisma/seed/data/grade5/*|prisma/seed/data/kk/grade5*) add grade5;;
              prisma/seed/data/nis/*|prisma/seed/data/kk/nis-*) add nis-science;;
              prisma/seed/data/eng/*) add nis-english;;
              prisma/seed/data/logic/*|prisma/seed/data/kk/logic*) add logic;;
              prisma/seed/data/math*|prisma/seed/data/kk/math*) add math;;
            esac
          done <<< "$FILES"
          echo "subjects=$S" >> "$GITHUB_OUTPUT"
          if [ -n "$S" ]; then echo "run=1" >> "$GITHUB_OUTPUT"; else echo "run=0" >> "$GITHUB_OUTPUT"; fi
          echo "Предметы: ${S:-нет изменений контента}"
      - name: Seed
        if: steps.pick.outputs.run == '1'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
          SEED_ONLY: ${{ steps.pick.outputs.subjects }}
        run: npm run db:seed
