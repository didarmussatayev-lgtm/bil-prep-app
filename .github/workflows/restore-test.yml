name: Restore test
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    services:
      pg:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: bil_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Install pg client 18
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget -qO- https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/trusted.gpg.d/pgdg.asc >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
      - name: Download latest backup from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          EP="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          KEY=$(aws s3api list-objects-v2 --bucket "${{ secrets.R2_BUCKET }}" --prefix bil- --endpoint-url "$EP" --query 'sort_by(Contents,&LastModified)[-1].Key' --output text)
          echo "Latest backup: $KEY"
          aws s3 cp "s3://${{ secrets.R2_BUCKET }}/$KEY" backup.dump.gpg --endpoint-url "$EP"
          ls -lh backup.dump.gpg
      - name: Decrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" -d -o backup.dump backup.dump.gpg
          ls -lh backup.dump
      - name: Restore into temporary Postgres
        env:
          PGPASSWORD: test
        run: |
          set -euo pipefail
          /usr/lib/postgresql/18/bin/pg_restore --no-owner --no-privileges -h localhost -U postgres -d bil_test backup.dump
      - name: Show tables and row counts
        env:
          PGPASSWORD: test
        run: |
          /usr/lib/postgresql/18/bin/psql -h localhost -U postgres -d bil_test -c "SELECT table_schema, table_name, (xpath('/row/c/text()', query_to_xml(format('select count(*) as c from %I.%I', table_schema, table_name), false, true, '')))[1]::text AS row_count FROM information_schema.tables WHERE table_schema NOT IN ('pg_catalog','information_schema') AND table_type='BASE TABLE' ORDER BY 1,2;"
