<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#58cc02">
<title>Нет соединения</title>
<style>
  :root { color-scheme: light dark; --bg:#f7f7f7; --surface:#fff; --border:#e5e5e5; --text:#3c3c3c; --muted:#777; --accent:#58cc02; --shade:#46a302; }
  @media (prefers-color-scheme: dark) { :root { --bg:#131f24; --surface:#1a2a31; --border:#2f444d; --text:#eaf2f5; --muted:#96aab3; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--text); font:500 16px/1.5 "Nunito","Trebuchet MS",system-ui,sans-serif; }
  main { width:min(100%,400px); padding:32px 28px; text-align:center; background:var(--surface); border:2px solid var(--border); border-bottom-width:5px; border-radius:24px; }
  .ico { font-size:56px; line-height:1; }
  h1 { margin:12px 0 6px; font-size:1.5rem; font-weight:800; }
  p { margin:0 0 20px; color:var(--muted); }
  button { width:100%; height:48px; font:inherit; font-weight:800; text-transform:uppercase; letter-spacing:.03em; color:#fff; background:var(--accent); border:0; border-radius:14px; box-shadow:0 4px 0 var(--shade); cursor:pointer; }
  button:active { transform:translateY(4px); box-shadow:none; }
</style>
</head>
<body>
<main>
  <div class="ico" aria-hidden="true">📡</div>
  <h1>Нет соединения</h1>
  <p>Эта страница ещё не сохранена на устройстве. Страницы, которые вы уже открывали, доступны без интернета. Проверьте сеть и повторите.</p>
  <button type="button" onclick="location.reload()">Повторить</button>
</main>
</body>
</html>
